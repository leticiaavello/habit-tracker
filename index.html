<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Desafio até 28/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5fc;
    --card:#ffffff;
    --card-soft:#f1eefa;
    --border:#e6e1f5;
    --p-50:#f3effc;
    --p-100:#e5ddf7;
    --p-300:#b7a3ec;
    --p-500:#8768de;
    --p-600:#6f4fce;
    --p-700:#5638ac;
    --p-900:#2c1f57;
    --warn:#d1665a;
    --warn-bg:#fbeceb;
    --text:#241d3d;
    --muted:#7a7192;
    --muted-2:#a89ec2;
    --shadow: 0 2px 10px rgba(44,31,87,0.05), 0 8px 24px rgba(44,31,87,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  .wrap{max-width:520px;margin:0 auto;padding:22px 16px 8px;}

  /* Header */
  .pass{
    background:linear-gradient(160deg, var(--p-700), var(--p-900));
    border-radius:20px;
    padding:22px 20px 20px;
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow);
    color:#fff;
  }
  .pass::before{
    content:"";
    position:absolute; top:-40px; right:-40px;
    width:160px; height:160px; border-radius:50%;
    background:rgba(255,255,255,0.06);
  }
  .pass::after{
    content:"";
    position:absolute; bottom:-60px; left:-30px;
    width:140px; height:140px; border-radius:50%;
    background:rgba(255,255,255,0.05);
  }
  .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--p-300); font-weight:700; position:relative;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    margin:5px 0 2px;
    letter-spacing:-.01em;
    position:relative;
  }
  .countdown{
    font-size:12px; color:var(--p-100); position:relative; font-weight:500;
  }
  .countdown b{ color:#fff; }
  .datebar{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:16px;
    position:relative;
  }
  .datebar .navbtn{
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15); color:#fff;
    width:34px; height:34px; border-radius:10px; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .datebar .navbtn:active{background:rgba(255,255,255,0.18);}
  .datelabel{ text-align:center; }
  .datelabel .day{ font-size:14px; color:#fff; font-weight:600; }
  .datelabel .sub{ font-size:10px; color:var(--p-300); text-transform:uppercase; letter-spacing:.08em; margin-top:1px;}
  .today-pill{
    position:absolute; top:0; right:0;
    font-size:9px; padding:4px 9px; border-radius:20px;
    background:rgba(255,255,255,0.14); color:#fff;
    letter-spacing:.06em; text-transform:uppercase; font-weight:600;
  }

  .score{
    display:flex; align-items:center; gap:14px;
    margin-top:18px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.12);
    position:relative;
  }
  .ring{ width:50px; height:50px; flex-shrink:0; }
  .score-text .n{ font-family:'Fraunces',serif; font-size:20px; font-weight:600; color:#fff; }
  .score-text .l{ font-size:10px; color:var(--p-300); letter-spacing:.05em; text-transform:uppercase; margin-top:1px;}

  /* Musculação challenge card */
  .musc-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px 18px;
    margin-top:10px;
    box-shadow:var(--shadow);
  }
  .musc-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .musc-top .label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted-2); font-weight:700; }
  .musc-top .goal{ font-size:11px; color:var(--muted-2); }
  .musc-main{ display:flex; align-items:baseline; gap:6px; margin-top:6px; }
  .musc-main .val{ font-family:'Fraunces',serif; font-size:28px; font-weight:600; color:var(--text); }
  .musc-main .unit{ font-size:13px; color:var(--muted); }
  .musc-bar{ margin-top:10px; height:8px; border-radius:6px; background:var(--card-soft); overflow:hidden; }
  .musc-bar .fill{ height:100%; background:linear-gradient(90deg,var(--p-500),var(--p-700)); border-radius:6px; }
  .musc-note{ font-size:10px; color:var(--muted-2); margin-top:8px; }

  /* Section headings */
  .section-title{
    font-family:'Manrope', sans-serif;
    font-size:12px; font-weight:800;
    color:var(--muted);
    margin:26px 4px 12px;
    text-transform:uppercase; letter-spacing:.08em;
  }

  /* Meal cards */
  .meal{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px 16px 14px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
  }
  .meal-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:12px;
  }
  .meal-head .name{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; color:var(--text); }
  .meal-head .status{ font-size:10px; color:var(--muted-2); font-weight:600;}
  .meal-head .status.done{ color:var(--p-600); }
  .opts{ display:flex; flex-wrap:wrap; gap:7px; }
  .opt{
    border:1.5px solid var(--border);
    background:var(--card-soft);
    color:var(--muted);
    font-family:'Manrope', sans-serif;
    font-size:12px;
    font-weight:500;
    padding:9px 12px;
    border-radius:10px;
    cursor:pointer;
    line-height:1.35;
    text-align:left;
    max-width:100%;
  }
  .opt .kcal{ color:var(--muted-2); font-size:10px; display:block; margin-top:2px;}
  .opt.selected{
    background:var(--p-600);
    border-color:var(--p-600);
    color:#fff;
  }
  .opt.selected .kcal{ color:var(--p-100); }
  .opt.skip{
    margin-left:auto;
    color:var(--muted-2);
    background:transparent;
    border-style:dashed;
  }
  .opt.skip.selected{
    background:var(--p-900);
    border-color:var(--p-900);
    border-style:solid;
    color:#fff;
  }

  /* Calories card */
  .kcal-card{
    background:linear-gradient(160deg, var(--p-600), var(--p-700));
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:10px;
    color:#fff;
    box-shadow:var(--shadow);
  }
  .kcal-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .kcal-top .label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--p-100); font-weight:700; }
  .kcal-main{ display:flex; align-items:baseline; gap:6px; margin-top:6px; }
  .kcal-main .val{ font-family:'Fraunces',serif; font-size:32px; font-weight:600; }
  .kcal-main .unit{ font-size:13px; color:var(--p-100); }
  .kcal-note{ font-size:10px; color:var(--p-100); margin-top:8px; }
  .kcal-breakdown{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .kcal-chip{
    background:rgba(255,255,255,0.12);
    font-size:10px; padding:5px 9px; border-radius:20px; color:#fff;
  }
  .kcal-chip.empty{ color:var(--p-100); background:rgba(255,255,255,0.06); }

  /* Goal cards */
  .goal{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
  }
  .goal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .goal-head .name{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; display:flex; align-items:center; gap:9px; color:var(--text);}
  .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .goal-head .check{
    font-size:10px; padding:4px 9px; border-radius:20px; border:1px solid var(--border); color:var(--muted-2); font-weight:600; white-space:nowrap;
  }
  .goal-head .check.met{ color:#fff; background:var(--p-600); border-color:var(--p-600);}
  .goal-head .check.warn{ color:#fff; background:var(--warn); border-color:var(--warn);}
  .goal-sub{ font-size:11px; color:var(--muted-2); margin-top:-4px; margin-bottom:10px; }

  /* Water */
  .water-row{ display:flex; align-items:center; gap:10px; }
  .glasses{ display:flex; gap:6px; flex-wrap:wrap; flex:1; }
  .glass{
    width:22px; height:28px; border-radius:4px 4px 8px 8px;
    border:1.5px solid var(--border);
    background:var(--card-soft);
    cursor:pointer;
    position:relative;
  }
  .glass.filled{ background:linear-gradient(var(--p-500), var(--p-700)); border-color:var(--p-600); }

  /* Stepper (livro / tela) */
  .stepper-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .stepper-val{ font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:var(--text); min-width:70px; }
  .stepper-val .of{ font-size:12px; color:var(--muted-2); font-family:'Manrope',sans-serif; font-weight:500; }
  .stepper-btns{ display:flex; gap:8px; }
  .stepper-btns button{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--border);
    background:var(--card-soft); color:var(--text); cursor:pointer; font-size:16px;
  }

  /* Toggle switch */
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; }
  .toggle-row .desc{ font-size:11px; color:var(--muted-2); max-width:70%; }
  .switch{
    width:46px; height:26px; border-radius:20px; background:var(--card-soft);
    border:1.5px solid var(--border); position:relative; cursor:pointer; flex-shrink:0;
  }
  .switch .knob{
    width:19px; height:19px; border-radius:50%; background:var(--muted-2);
    position:absolute; top:2px; left:2px; transition:left .15s ease, background .15s ease;
  }
  .switch.on{ background:var(--p-600); border-color:var(--p-600); }
  .switch.on .knob{ left:23px; background:#fff; }

  .gratitude-box textarea{
    width:100%; border:1.5px solid var(--border); border-radius:10px; background:var(--card-soft);
    color:var(--text); font-family:'Manrope',sans-serif; font-size:12px; padding:10px;
    resize:vertical; min-height:60px;
  }
  .gratitude-box textarea::placeholder{ color:var(--muted-2); }

  /* Consolidated / summary */
  .summary-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
  }
  .summary-tabs{ display:flex; gap:6px; margin-bottom:14px; }
  .tab-btn{
    flex:1; border:1px solid var(--border); background:var(--card-soft);
    color:var(--muted); font-family:'Manrope',sans-serif; font-weight:600;
    font-size:12px; padding:8px; border-radius:10px; cursor:pointer;
  }
  .tab-btn.active{ background:var(--p-600); border-color:var(--p-600); color:#fff; }
  .heatmap-week{ display:flex; gap:6px; justify-content:space-between; }
  .heatmap-week .col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .heatmap-week .wd{ font-size:9px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.04em; }
  .cell{
    width:34px; height:34px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:600;
    border:1px solid var(--border);
  }
  .month-head{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:6px; }
  .month-head span{ text-align:center; font-size:9px; color:var(--muted-2); text-transform:uppercase; }
  .heatmap-month{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .heatmap-month .cell{ width:100%; aspect-ratio:1; border-radius:7px; font-size:10px; }
  .cell.blank{ border:none; background:transparent; }
  .cell.future{ background:transparent; border-style:dashed; color:var(--muted-2); }
  .legend{ display:flex; align-items:center; gap:5px; margin-top:12px; font-size:9px; color:var(--muted-2); }
  .legend .cell{ width:14px; height:14px; border-radius:4px; }
  .stat-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px;
  }
  .stat-tile{
    background:var(--card-soft); border-radius:10px; padding:10px 12px;
  }
  .stat-tile .v{ font-family:'Fraunces',serif; font-size:18px; font-weight:600; color:var(--text); }
  .stat-tile .l{ font-size:9px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }

  /* Weight card */
  .weight-input-row{
    display:flex; align-items:baseline; justify-content:flex-end; gap:6px;
  }
  .weight-input-row input[type=number]{
    width:120px; font-family:'Fraunces',serif; font-size:26px; font-weight:600;
    text-align:right; border:none; background:transparent; color:var(--text);
    outline:none; -moz-appearance:textfield;
  }
  .weight-input-row input[type=number]::-webkit-outer-spin-button,
  .weight-input-row input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .weight-input-row .unit{ font-size:13px; color:var(--muted-2); }
  .weight-chart-card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:16px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .weight-chart-empty{ font-size:11px; color:var(--muted-2); text-align:center; padding:20px 0; }
  .weight-stats{ display:flex; justify-content:space-between; margin-top:12px; }
  .weight-stat{ text-align:center; flex:1; }
  .weight-stat .v{ font-family:'Fraunces',serif; font-size:15px; font-weight:600; color:var(--text); }
  .weight-stat .l{ font-size:9px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }
  .weight-stat .v.down{ color:var(--p-600); }
  .weight-stat .v.up{ color:var(--warn); }

  .footer-note{
    text-align:center; font-size:10px; color:var(--muted-2); margin-top:26px; line-height:1.6;
  }
  .loading{ text-align:center; padding:40px 0; color:var(--muted-2); font-size:12px;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">carregando…</div>
</div>

<script>
const CHALLENGE_END = new Date(2026, 9, 28); // 28/10/2026
const MEALS = [
  { id:'cafe', label:'Café da manhã', options:[
    {id:'original', name:'Pão + ovo + fruta', kcal:260},
    {id:'sub1', name:'Pão + cottage 50g + fruta', kcal:240},
    {id:'sub2', name:'Leite + fruta + leite em pó + aveia', kcal:230},
  ]},
  { id:'almoco', label:'Almoço', options:[
    {id:'original', name:'Arroz + feijão + frango + salada', kcal:420},
    {id:'sub1', name:'Macarrão 90g + carne moída 90g + salada', kcal:360},
    {id:'sub2', name:'Arroz 100g + peixe 180g + salada', kcal:330},
  ]},
  { id:'lanche', label:'Lanche da tarde', options:[
    {id:'original', name:'Pão + cottage 20g + frango 50g', kcal:225},
    {id:'sub1', name:'Pão + atum 60g + milho 20g', kcal:220},
    {id:'sub2', name:'Pão + 2 ovos', kcal:270},
    {id:'sub3', name:'Iogurte + fruta + whey', kcal:240},
    {id:'sub4', name:'Aveia + banana + ovo + cacau + whey', kcal:320},
  ]},
];

const WEEKDAYS = ['dom','seg','ter','qua','qui','sex','sáb'];
const MONTHS = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

function fmtDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){ return fmtDate(new Date()); }

let currentDate = new Date();
let dayData = null;
let config = { waterGoal:12, livroMeta:10, telaMax:4, muscMeta:25 };
let allDaysMap = {};
let summaryMode = 'week';

function emptyDay(){
  return {
    meals: { cafe:null, almoco:null, lanche:null },
    jantarJejum:false,
    water:0,
    semAcucar:false,
    livroPaginas:0,
    telaHoras:0,
    videoPodcast:false,
    cardio:false,
    musculacao:false,
    gratidao:false,
    gratidaoTexto:'',
    skincare:false,
    peso:null
  };
}

async function loadConfig(){
  try{
    const raw = localStorage.getItem('config');
    if(raw) config = Object.assign({ waterGoal:12, livroMeta:10, telaMax:4, muscMeta:25 }, JSON.parse(raw));
  }catch(e){}
}
async function saveConfig(){
  try{ localStorage.setItem('config', JSON.stringify(config)); }catch(e){ console.error(e); }
}
async function loadDay(dateStr){
  try{
    const raw = localStorage.getItem('day:'+dateStr);
    if(raw) return Object.assign(emptyDay(), JSON.parse(raw));
  }catch(e){}
  return emptyDay();
}
async function saveDay(dateStr, data){
  try{ localStorage.setItem('day:'+dateStr, JSON.stringify(data)); }catch(e){ console.error(e); }
}
function getAllDaysMap(){
  const map = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith('day:')){
      try{ map[k.slice(4)] = Object.assign(emptyDay(), JSON.parse(localStorage.getItem(k))); }catch(e){}
    }
  }
  return map;
}

function completionCount(d){
  let n = 0;
  MEALS.forEach(m => { if(d.meals[m.id]) n++; });
  if(d.jantarJejum) n++;
  if(d.water >= config.waterGoal) n++;
  if(d.semAcucar) n++;
  if(d.livroPaginas >= config.livroMeta) n++;
  if(d.telaHoras <= config.telaMax) n++;
  if(d.videoPodcast) n++;
  if(d.cardio) n++;
  if(d.musculacao) n++;
  if(d.gratidao) n++;
  if(d.skincare) n++;
  return n;
}
const TOTAL_ITEMS = MEALS.length + 10;

function kcalTotal(d){
  let total = 0;
  const parts = [];
  MEALS.forEach(m => {
    const selId = d.meals[m.id];
    if(selId && selId !== 'none'){
      const opt = m.options.find(o => o.id === selId);
      if(opt){ total += opt.kcal; parts.push({label:m.label, kcal:opt.kcal}); }
    }
  });
  return { total, parts };
}

function ringSVG(pct){
  const r = 21, c = 2*Math.PI*r;
  const off = c - (pct/100)*c;
  return `<svg class="ring" viewBox="0 0 50 50">
    <circle cx="25" cy="25" r="${r}" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="5"/>
    <circle cx="25" cy="25" r="${r}" fill="none" stroke="#b7a3ec" stroke-width="5"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"
      transform="rotate(-90 25 25)"/>
  </svg>`;
}

function muscTotalCount(){
  let n = 0;
  Object.keys(allDaysMap).forEach(k => { if(allDaysMap[k].musculacao) n++; });
  if(!allDaysMap[fmtDate(currentDate)]) { if(dayData && dayData.musculacao) n++; }
  return n;
}

function dayScorePct(d){
  if(!d) return 0;
  return Math.round((completionCount(d)/TOTAL_ITEMS)*100);
}
function scoreColor(pct, hasData){
  if(!hasData) return null;
  if(pct>=100) return 'var(--p-700)';
  if(pct>=75) return 'var(--p-600)';
  if(pct>=50) return 'var(--p-500)';
  if(pct>=25) return 'var(--p-300)';
  if(pct>0) return 'var(--p-100)';
  return 'var(--card-soft)';
}
function scoreTextColor(pct, hasData){
  if(!hasData) return 'var(--muted-2)';
  if(pct>=50) return '#fff';
  return 'var(--text)';
}

function periodStats(dates){
  let tracked=0, sumPct=0, waterDays=0, semAcucarDays=0, cardioDays=0, muscDays=0,
      gratidaoDays=0, skincareDays=0, videoDays=0, telaOkDays=0, livroTotal=0, mealsLogged=0;
  dates.forEach(dStr => {
    const d = allDaysMap[dStr];
    if(!d) return;
    tracked++;
    sumPct += dayScorePct(d);
    if(d.water >= config.waterGoal) waterDays++;
    if(d.semAcucar) semAcucarDays++;
    if(d.cardio) cardioDays++;
    if(d.musculacao) muscDays++;
    if(d.gratidao) gratidaoDays++;
    if(d.skincare) skincareDays++;
    if(d.videoPodcast) videoDays++;
    if(d.telaHoras <= config.telaMax) telaOkDays++;
    livroTotal += (d.livroPaginas||0);
    MEALS.forEach(m => { const s=d.meals[m.id]; if(s && s!=='none') mealsLogged++; });
    if(d.jantarJejum) mealsLogged++;
  });
  return { tracked, total:dates.length, avgPct: tracked?Math.round(sumPct/tracked):0,
    waterDays, semAcucarDays, cardioDays, muscDays, gratidaoDays, skincareDays, videoDays, telaOkDays, livroTotal, mealsLogged };
}

function buildSummaryHTML(){
  const now = new Date();
  let bodyHtml = '';
  let dates = [];

  if(summaryMode === 'week'){
    for(let i=6;i>=0;i--){ const d = new Date(now); d.setDate(now.getDate()-i); dates.push(fmtDate(d)); }
    bodyHtml += `<div class="heatmap-week">`;
    dates.forEach(dStr => {
      const d = allDaysMap[dStr];
      const hasData = !!d;
      const pct = dayScorePct(d);
      const dt = new Date(dStr+'T00:00:00');
      const bg = scoreColor(pct, hasData);
      const fg = scoreTextColor(pct, hasData);
      bodyHtml += `<div class="col">
        <div class="wd">${WEEKDAYS[dt.getDay()]}</div>
        <div class="cell" style="background:${bg||'transparent'};color:${fg};${!hasData?'border-style:dashed':''}">${dt.getDate()}</div>
      </div>`;
    });
    bodyHtml += `</div>`;
  } else {
    const y = now.getFullYear(), m = now.getMonth();
    const firstDay = new Date(y, m, 1);
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const startOffset = firstDay.getDay();
    bodyHtml += `<div class="month-head">${WEEKDAYS.map(w=>`<span>${w}</span>`).join('')}</div>`;
    bodyHtml += `<div class="heatmap-month">`;
    for(let i=0;i<startOffset;i++) bodyHtml += `<div class="cell blank"></div>`;
    for(let day=1; day<=daysInMonth; day++){
      const dt = new Date(y,m,day);
      const dStr = fmtDate(dt);
      const isFuture = dt > now;
      dates.push(dStr);
      if(isFuture){ bodyHtml += `<div class="cell future">${day}</div>`; continue; }
      const d = allDaysMap[dStr];
      const hasData = !!d;
      const pct = dayScorePct(d);
      const bg = scoreColor(pct, hasData);
      const fg = scoreTextColor(pct, hasData);
      bodyHtml += `<div class="cell" style="background:${bg||'transparent'};color:${fg};${!hasData?'border-style:dashed':''}">${day}</div>`;
    }
    bodyHtml += `</div>`;
    dates = dates.filter(dStr => new Date(dStr+'T00:00:00') <= now);
  }

  const st = periodStats(dates);

  bodyHtml += `<div class="legend">
      escala: <div class="cell" style="background:var(--card-soft)"></div>
      <div class="cell" style="background:var(--p-100)"></div>
      <div class="cell" style="background:var(--p-300)"></div>
      <div class="cell" style="background:var(--p-500)"></div>
      <div class="cell" style="background:var(--p-700)"></div> mais metas
    </div>`;

  bodyHtml += `<div class="stat-grid">
    <div class="stat-tile"><div class="v">${st.tracked}/${st.total}</div><div class="l">dias registrados</div></div>
    <div class="stat-tile"><div class="v">${st.avgPct}%</div><div class="l">média de conclusão</div></div>
    <div class="stat-tile"><div class="v">${st.cardioDays}</div><div class="l">dias com cardio</div></div>
    <div class="stat-tile"><div class="v">${st.muscDays}</div><div class="l">treinos no período</div></div>
    <div class="stat-tile"><div class="v">${st.semAcucarDays}</div><div class="l">dias sem açúcar</div></div>
    <div class="stat-tile"><div class="v">${st.telaOkDays}</div><div class="l">dias com tela ok</div></div>
    <div class="stat-tile"><div class="v">${st.gratidaoDays}</div><div class="l">dias de gratidão</div></div>
    <div class="stat-tile"><div class="v">${st.skincareDays}</div><div class="l">dias de skincare</div></div>
    <div class="stat-tile"><div class="v">${st.videoDays}</div><div class="l">vídeos/podcasts</div></div>
    <div class="stat-tile"><div class="v">${st.livroTotal}</div><div class="l">páginas lidas</div></div>
  </div>`;

  return `<div class="section-title">Consolidado</div>
  <div class="summary-card">
    <div class="summary-tabs">
      <button class="tab-btn ${summaryMode==='week'?'active':''}" id="tabWeek">Semana</button>
      <button class="tab-btn ${summaryMode==='month'?'active':''}" id="tabMonth">Mês</button>
    </div>
    ${bodyHtml}
  </div>`;
}

function getWeightSeries(){
  return Object.keys(allDaysMap)
    .filter(k => allDaysMap[k].peso != null && allDaysMap[k].peso !== '')
    .sort()
    .map(k => ({ date:k, peso: parseFloat(allDaysMap[k].peso) }));
}

function weightChartSVG(series){
  const W = 480, H = 150, padX = 12, padY = 18;
  const vals = series.map(s => s.peso);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const stepX = series.length > 1 ? (W - padX*2) / (series.length - 1) : 0;
  const points = series.map((s,i) => {
    const x = padX + i*stepX;
    const y = padY + (H - padY*2) * (1 - (s.peso - min) / range);
    return { x, y, ...s };
  });
  const pathD = points.map((p,i) => (i===0?'M':'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  const areaD = pathD + ` L ${points[points.length-1].x.toFixed(1)} ${H-padY} L ${points[0].x.toFixed(1)} ${H-padY} Z`;
  const dots = points.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="var(--p-700)" stroke="#fff" stroke-width="1.5"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    <defs><linearGradient id="wgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8768de" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8768de" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaD}" fill="url(#wgrad)"/>
    <path d="${pathD}" fill="none" stroke="var(--p-600)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}

function render(){
  const app = document.getElementById('app');
  const dStr = fmtDate(currentDate);
  const isToday = dStr === todayStr();
  const done = completionCount(dayData);
  const pct = Math.round((done/TOTAL_ITEMS)*100);

  const now = new Date();
  const daysLeft = Math.ceil((CHALLENGE_END - new Date(now.getFullYear(),now.getMonth(),now.getDate())) / 86400000);
  const muscTotal = muscTotalCount();
  const muscPct = Math.min(100, Math.round((muscTotal/config.muscMeta)*100));

  let html = '';

  html += `<div class="pass">
    ${isToday ? '<div class="today-pill">hoje</div>' : ''}
    <div class="eyebrow">Desafio</div>
    <h1>Até 28 de outubro</h1>
    <div class="countdown">${daysLeft >= 0 ? `<b>${daysLeft}</b> dias restantes` : 'desafio encerrado'}</div>
    <div class="datebar">
      <button class="navbtn" id="prevBtn">‹</button>
      <div class="datelabel">
        <div class="day">${WEEKDAYS[currentDate.getDay()]}, ${currentDate.getDate()} ${MONTHS[currentDate.getMonth()]}</div>
        <div class="sub">${currentDate.getFullYear()}</div>
      </div>
      <button class="navbtn" id="nextBtn">›</button>
    </div>
    <div class="score">
      ${ringSVG(pct)}
      <div class="score-text">
        <div class="n">${done}/${TOTAL_ITEMS}</div>
        <div class="l">metas do dia</div>
      </div>
    </div>
  </div>`;

  html += `<div class="musc-card">
    <div class="musc-top">
      <div class="label">Musculação no desafio</div>
      <div class="goal">meta ${config.muscMeta} treinos</div>
    </div>
    <div class="musc-main"><span class="val">${muscTotal}</span><span class="unit">/ ${config.muscMeta} treinos até 28/10</span></div>
    <div class="musc-bar"><div class="fill" style="width:${muscPct}%"></div></div>
    <div class="musc-note">${muscTotal >= config.muscMeta ? 'meta batida! 🎉' : `faltam ${config.muscMeta-muscTotal} treinos`}</div>
  </div>`;

  const weightSeries = getWeightSeries();
  html += `<div class="section-title">Peso</div>`;
  html += `<div class="goal">
    <div class="goal-head">
      <div class="name"><span class="dot" style="background:var(--p-600)"></span>Peso de hoje</div>
    </div>
    <div class="weight-input-row">
      <input type="number" step="0.1" min="0" id="pesoInput" value="${dayData.peso ?? ''}" placeholder="—" />
      <span class="unit">kg</span>
    </div>
  </div>`;

  if(weightSeries.length >= 2){
    const vals = weightSeries.map(s=>s.peso);
    const first = vals[0], last = vals[vals.length-1];
    const diff = +(last-first).toFixed(1);
    const min = Math.min(...vals), max = Math.max(...vals);
    html += `<div class="weight-chart-card">
      ${weightChartSVG(weightSeries)}
      <div class="weight-stats">
        <div class="weight-stat"><div class="v">${last} kg</div><div class="l">atual</div></div>
        <div class="weight-stat"><div class="v ${diff<0?'down':(diff>0?'up':'')}">${diff>0?'+':''}${diff} kg</div><div class="l">variação</div></div>
        <div class="weight-stat"><div class="v">${min} kg</div><div class="l">mínimo</div></div>
        <div class="weight-stat"><div class="v">${max} kg</div><div class="l">máximo</div></div>
      </div>
    </div>`;
  } else {
    html += `<div class="weight-chart-card"><div class="weight-chart-empty">registre o peso em pelo menos 2 dias para ver a evolução</div></div>`;
  }

  html += `<div class="section-title">Refeições</div>`;
  MEALS.forEach(meal => {
    const sel = dayData.meals[meal.id];
    html += `<div class="meal">
      <div class="meal-head">
        <div class="name">${meal.label}</div>
        <div class="status ${sel ? 'done' : ''}">${sel ? '✓ dentro da dieta' : 'pendente'}</div>
      </div>
      <div class="opts">`;
    meal.options.forEach(opt => {
      const isSel = sel === opt.id;
      html += `<button class="opt ${isSel?'selected':''}" data-meal="${meal.id}" data-opt="${opt.id}">
        ${opt.name}<span class="kcal">${opt.kcal} kcal</span>
      </button>`;
    });
    html += `<button class="opt skip ${sel==='none'?'selected':''}" data-meal="${meal.id}" data-opt="none">não segui</button>`;
    html += `</div></div>`;
  });

  html += `<div class="meal">
    <div class="meal-head">
      <div class="name">Jantar</div>
      <div class="status ${dayData.jantarJejum ? 'done' : ''}">${dayData.jantarJejum ? '✓ em jejum' : 'pendente'}</div>
    </div>
    <div class="toggle-row">
      <div class="desc">Fiquei em jejum no jantar hoje</div>
      <div class="switch ${dayData.jantarJejum?'on':''}" id="jantarToggle"><div class="knob"></div></div>
    </div>
  </div>`;

  const kc = kcalTotal(dayData);
  html += `<div class="kcal-card">
    <div class="kcal-top"><div class="label">Calorias das refeições</div></div>
    <div class="kcal-main"><span class="val">${kc.total}</span><span class="unit">kcal</span></div>
    <div class="kcal-note">${kc.parts.length === 0 ? 'nenhuma refeição registrada ainda' : 'café + almoço + lanche · jantar em jejum não soma calorias'}</div>
    <div class="kcal-breakdown">
      ${MEALS.map(m => {
        const selId = dayData.meals[m.id];
        const opt = selId && selId !== 'none' ? m.options.find(o => o.id === selId) : null;
        return opt ? `<div class="kcal-chip">${m.label} · ${opt.kcal} kcal</div>` : `<div class="kcal-chip empty">${m.label} · —</div>`;
      }).join('')}
    </div>
  </div>`;

  html += `<div class="section-title">Metas do dia</div>`;

  const waterMet = dayData.water >= config.waterGoal;
  html += `<div class="goal">
    <div class="goal-head">
      <div class="name"><span class="dot" style="background:var(--p-500)"></span>Água · meta 3L</div>
      <div class="check ${waterMet?'met':''}">${waterMet ? 'meta batida' : dayData.water+'/'+config.waterGoal}</div>
    </div>
    <div class="water-row"><div class="glasses" id="glasses">`;
  for(let i=0;i<config.waterGoal;i++){ html += `<div class="glass ${i < dayData.water ? 'filled':''}" data-idx="${i}"></div>`; }
  html += `</div></div></div>`;

  html += `<div class="goal">
    <div class="goal-head">
      <div class="name"><span class="dot" style="background:var(--p-600)"></span>Sem açúcar</div>
      <div class="check ${dayData.semAcucar?'met':''}">${dayData.semAcucar?'meta batida':'pendente'}</div>
    </div>
    <div class="toggle-row">
      <div class="desc">Não consumi açúcar hoje</div>
      <div class="switch ${dayData.semAcucar?'on':''}" id="acucarToggle"><div class="knob"></div></div>
    </div>
  </div>`;

  const livroMet = dayData.livroPaginas >= config.livroMeta;
  html += `<div class="goal">
    <div class="goal-head">
      <div class="name"><span class="dot" style="background:var(--p-700)"></span>Livro</div>
      <div class="check ${livroMet?'met':''}">${livroMet?'meta batida':'pendente'}</div>
    </div>
    <div class="stepper-row">
      <div class="stepper-val">${dayData.livroPaginas} <span class="of">/ ${config.livroMeta} pág.</span></div>
      <div class="stepper-btns">
        <button id="livroMinus">−</button>
        <button id="livroPlus">+</button>
      </div>
    </div>
  </div>`;

  const telaMet = dayData.telaHoras <= config.telaMax;
  html += `<div class="goal">
    <div class="goal-head">
      <div class="name"><span class="dot" style="background:var(--p-300)"></span>Tela</div>
      <div class="check ${telaMet?'met':'warn'}">${telaMet?'dentro do limite':'acima do limite'}</div>
    </div>
    <div class="goal-sub">máx. ${config.telaMax}h de tela por dia</div>
    <div class="stepper-row">
      <div class="stepper-val">${dayData.telaHoras}<span class="of">h</span></div>
      <div class="stepper-btns">
        <button id="telaMinus">−</button>
        <button id="telaPlus">+</button>
      </div>
    </div>
  </div>`;

  html += `<div class="goal">
    <div class="goal-head">
      <div class="name"><span class="dot" style="background:var(--p-500)"></span>Vídeo/podcast diferente</div>
      <div class="check ${dayData.videoPodcast?'met':''}">${dayData.videoPodcast?'meta batida':'pendente'}</div>
    </div>
    <div class="toggle-row">
      <div class="desc">Assisti/ouvi algo novo hoje</div>
      <div class="switch ${dayData.videoPodcast?'on':''}" id="videoToggle"><div class="knob"></div></div>
    </div>
  </div>`;

  html += `<div class="goal">
    <div class="goal-head">
      <div class="name"><span class="dot" style="background:var(--p-600)"></span>Cardio</div>
      <div class="check ${dayData.cardio?'met':''}">${dayData.cardio?'meta batida':'pendente'}</div>
    </div>
    <div class="toggle-row">
      <div class="desc">Cardio todos os dias</div>
      <div class="switch ${dayData.cardio?'on':''}" id="cardioToggle"><div class="knob"></div></div>
    </div>
  </div>`;

  html += `<div class="goal">
    <div class="goal-head">
      <div class="name"><span class="dot" style="background:var(--p-700)"></span>Musculação</div>
      <div class="check ${dayData.musculacao?'met':''}">${dayData.musculacao?'treino feito':'pendente'}</div>
    </div>
    <div class="toggle-row">
      <div class="desc">Treinei musculação hoje (soma para os 25)</div>
      <div class="switch ${dayData.musculacao?'on':''}" id="muscToggle"><div class="knob"></div></div>
    </div>
  </div>`;

  html += `<div class="goal">
    <div class="goal-head">
      <div class="name"><span class="dot" style="background:var(--p-900)"></span>Diário da gratidão</div>
      <div class="check ${dayData.gratidao?'met':''}">${dayData.gratidao?'meta batida':'pendente'}</div>
    </div>
    <div class="toggle-row">
      <div class="desc">Escrevi/pensei na gratidão de hoje</div>
      <div class="switch ${dayData.gratidao?'on':''}" id="gratidaoToggle"><div class="knob"></div></div>
    </div>
  </div>`;

  html += `<div class="goal">
    <div class="goal-head">
      <div class="name"><span class="dot" style="background:var(--p-300)"></span>Skincare</div>
      <div class="check ${dayData.skincare?'met':''}">${dayData.skincare?'meta batida':'pendente'}</div>
    </div>
    <div class="toggle-row">
      <div class="desc">Rotina de skincare feita</div>
      <div class="switch ${dayData.skincare?'on':''}" id="skincareToggle"><div class="knob"></div></div>
    </div>
  </div>`;

  html += buildSummaryHTML();

  html += `<div class="footer-note">seus dados ficam salvos por dia — navegue pelas setas para ver ou editar dias anteriores</div>`;

  app.innerHTML = html;
  attachHandlers();
}

function attachHandlers(){
  document.getElementById('prevBtn').onclick = () => changeDay(-1);
  document.getElementById('nextBtn').onclick = () => changeDay(1);

  document.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      const meal = btn.dataset.meal, opt = btn.dataset.opt;
      dayData.meals[meal] = (dayData.meals[meal] === opt) ? null : opt;
      persist(); render();
    };
  });

  document.querySelectorAll('.glass').forEach(g => {
    g.onclick = () => {
      const idx = parseInt(g.dataset.idx,10);
      dayData.water = (dayData.water === idx+1) ? idx : idx+1;
      persist(); render();
    };
  });

  document.getElementById('jantarToggle').onclick = () => { dayData.jantarJejum = !dayData.jantarJejum; persist(); render(); };
  document.getElementById('acucarToggle').onclick = () => { dayData.semAcucar = !dayData.semAcucar; persist(); render(); };
  document.getElementById('videoToggle').onclick = () => { dayData.videoPodcast = !dayData.videoPodcast; persist(); render(); };
  document.getElementById('cardioToggle').onclick = () => { dayData.cardio = !dayData.cardio; persist(); render(); };
  document.getElementById('muscToggle').onclick = () => { dayData.musculacao = !dayData.musculacao; persist(); render(); };
  document.getElementById('skincareToggle').onclick = () => { dayData.skincare = !dayData.skincare; persist(); render(); };

  document.getElementById('livroMinus').onclick = () => { dayData.livroPaginas = Math.max(0, dayData.livroPaginas-1); persist(); render(); };
  document.getElementById('livroPlus').onclick = () => { dayData.livroPaginas += 1; persist(); render(); };
  document.getElementById('telaMinus').onclick = () => { dayData.telaHoras = Math.max(0, +(dayData.telaHoras-0.5).toFixed(1)); persist(); render(); };
  document.getElementById('telaPlus').onclick = () => { dayData.telaHoras = +(dayData.telaHoras+0.5).toFixed(1); persist(); render(); };

  document.getElementById('gratidaoToggle').onclick = () => { dayData.gratidao = !dayData.gratidao; persist(); render(); };

  const pesoInput = document.getElementById('pesoInput');
  pesoInput.addEventListener('change', () => {
    const v = parseFloat(pesoInput.value);
    dayData.peso = isNaN(v) ? null : v;
    persist();
    allDaysMap[fmtDate(currentDate)] = dayData;
    render();
  });

  const tabWeek = document.getElementById('tabWeek');
  const tabMonth = document.getElementById('tabMonth');
  if(tabWeek) tabWeek.onclick = () => { summaryMode='week'; render(); };
  if(tabMonth) tabMonth.onclick = () => { summaryMode='month'; render(); };
}

function persist(){
  saveDay(fmtDate(currentDate), dayData);
  allDaysMap[fmtDate(currentDate)] = dayData;
}

async function changeDay(delta){
  currentDate.setDate(currentDate.getDate()+delta);
  dayData = await loadDay(fmtDate(currentDate));
  allDaysMap[fmtDate(currentDate)] = dayData;
  render();
}

async function init(){
  await loadConfig();
  allDaysMap = getAllDaysMap();
  dayData = await loadDay(fmtDate(currentDate));
  allDaysMap[fmtDate(currentDate)] = dayData;
  render();
}

init();
</script>
</body>
</html>
